```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thumbnail Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- TOP BAR -->
    <header class="topbar">

      <div class="brand">
        <div class="brand-mark">T</div>
        <div>
          <div class="brand-name">Thumbnail Studio</div>
          <div class="brand-subtitle">Creative Editor</div>
        </div>
      </div>

      <div class="top-actions">

        <button class="top-btn" id="newProjectBtn">
          <span>＋</span> New
        </button>

        <button class="top-btn" id="undoBtn">
          ↶
        </button>

        <button class="top-btn" id="redoBtn">
          ↷
        </button>

        <div class="divider"></div>

        <button class="export-btn" id="exportBtn">
          Export
        </button>

      </div>

    </header>


    <!-- MAIN WORKSPACE -->
    <main class="workspace">


      <!-- LEFT TOOLBAR -->
      <aside class="toolbar">

        <button class="tool active" data-tool="select">
          <span>⌁</span>
          <small>Select</small>
        </button>

        <button class="tool" data-tool="text" id="addTextBtn">
          <span>T</span>
          <small>Text</small>
        </button>

        <button class="tool" data-tool="image" id="uploadImageBtn">
          <span>▧</span>
          <small>Image</small>
        </button>

        <button class="tool" data-tool="shape">
          <span>□</span>
          <small>Shape</small>
        </button>

        <button class="tool" data-tool="background">
          <span>◐</span>
          <small>Background</small>
        </button>

        <div class="toolbar-spacer"></div>

        <button class="tool" id="zoomOutBtn">
          <span>−</span>
          <small>Zoom</small>
        </button>

        <button class="tool" id="zoomInBtn">
          <span>＋</span>
          <small>Zoom</small>
        </button>

      </aside>


      <!-- CENTER -->
      <section class="editor-area">

        <div class="canvas-toolbar">

          <div class="canvas-info">
            <span class="status-dot"></span>
            <span id="canvasSizeLabel">1280 × 720</span>
          </div>

          <div class="canvas-controls">

            <button id="fitBtn">Fit</button>

            <span id="zoomLabel">60%</span>

            <button id="fullscreenBtn">⛶</button>

          </div>

        </div>


        <div class="canvas-wrapper" id="canvasWrapper">

          <div class="canvas-shadow">

            <div
              id="canvas"
              class="canvas"
              style="width:1280px;height:720px;"
            >

              <div
                class="background-layer"
                id="backgroundLayer"
              ></div>

            </div>

          </div>

        </div>


        <div class="bottom-bar">

          <div class="hint">
            <span>Drag elements to move</span>
          </div>

          <div class="coordinates">
            <span id="cursorX">X: 0</span>
            <span id="cursorY">Y: 0</span>
          </div>

        </div>

      </section>


      <!-- RIGHT PANEL -->
      <aside class="properties-panel">

        <!-- LAYERS -->

        <section class="panel-section layers-section">

          <div class="panel-title-row">

            <h3>Layers</h3>

            <div class="layer-actions">
              <button id="duplicateBtn">⧉</button>
              <button id="deleteBtn">⌫</button>
            </div>

          </div>

          <div class="layers" id="layers">

            <div
              class="layer-item background-item selected"
              data-layer="background"
            >

              <div class="layer-icon">◐</div>

              <div class="layer-name">
                Background
              </div>

              <div class="layer-visibility">
                ●
              </div>

            </div>

          </div>

        </section>


        <!-- PROPERTIES -->

        <section class="panel-section properties-section">

          <div class="panel-title-row">
            <h3>Properties</h3>
          </div>

          <div id="properties">

            <div class="empty-properties">

              <div class="empty-icon">✦</div>

              <strong>No element selected</strong>

              <span>
                Select an element to edit its properties.
              </span>

            </div>

          </div>

        </section>

      </aside>

    </main>

  </div>


  <!-- HIDDEN FILE INPUT -->
  <input
    type="file"
    id="imageInput"
    accept="image/png,image/jpeg,image/webp"
    hidden
  >


  <script src="app.js"></script>

</body>
</html>
```
